schema_version: "1.0"

extension:
  id: "arch"                          # Lowercase, alphanumeric + hyphens only
  name: "Architecture Scanner"
  version: "1.0.0"                      # Semantic versioning
  description: "arch. :fox_face Extension for scanning code to discover business objects and interactions"
  author: "Gladarenko Andrei"
  repository: "https://github.com/andreiGY/arch"
  license: "MIT"

requires:
  speckit_version: ">=0.8.9.dev0"            # Minimum spec-kit version
  commands:                             # Optional: Core commands needed
    - "speckit.implement"

provides:
  commands:
    - name: "speckit.arch.scanner"      # Must follow pattern: speckit.{ext-id}.{cmd}
      file: "commands/bo_scanner.md"
      description: "Scans for business objects"


tags:                                   # Optional: For catalog search
  - "architecture"
  - "business-objects"