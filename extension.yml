schema_version: "1.0"

extension:
  id: "arch"                          # Lowercase, alphanumeric + hyphens only
  name: "Architecture Scanner"
  version: "1.0.1"                      # Semantic versioning
  description: "arch. Extension for scanning code to discover business objects and interactions"
  author: "Gladarenko Andrei"
  repository: "https://github.com/andreiGY/arch"
  license: "MIT"

requires:
  speckit_version: ">=0.8.9.dev0"            # Minimum spec-kit version
  commands:                             # Optional: Core commands needed
    - "speckit.implement"

provides:
  commands:
    - name: "speckit.arch.scanner"      # Must follow pattern: speckit.{ext-id}.{cmd}
      file: "commands/scanner.md"
      description: "Scans for business objects"

  hooks:
    after_implement:
      command: "speckit.arch.scanner"
      optional: false
      prompt: "Run architecture scanner to analyze discovered business objects?"
      description: "Scans implementation for business objects and interactions"

tags:                                   # Optional: For catalog search
  - "architecture"
  - "business-objects"